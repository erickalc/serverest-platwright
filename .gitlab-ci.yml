image: mcr.microsoft.com/playwright:v1.64.1-jammy

variables:
  BASE_URL: "https://serverest.dev"

stages:
  - test

testes_api:
  stage: test
  script:
    - npm ci
    - npx playwright test
  after_script:
    - npx allure generate allure-results -o allure-report --clean
  artifacts:
    when: always
    paths:
      - test-results/
      - allure-results/
      - allure-report/
    expire_in: 7 days