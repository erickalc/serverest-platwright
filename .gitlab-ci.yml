image: mcr.microsoft.com/playwright:v1.64.1-jammy

stages:
  - test

testes_api:
  stage: test
  script:
    - npm ci 
    - npx playwright test 
    - npx allure generate allure-results -o allure-report --clean
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - allure-results/
      - allure-report/
    expire_in: 7 days